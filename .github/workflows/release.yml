name: Release

# Manual trigger only, and every job stops at the first step until the signing secrets exist.
# Nothing here runs on push or tag. See docs/guide/development.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release; must equal <Version> in Directory.Build.props
        required: true
        type: string

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          # Secrets are exposed only through env, never echoed. Empty on a repo without them.
          MAC_CERT_P12: ${{ secrets.KZG_MAC_CERT_P12 }}
        run: |
          if [ -z "$MAC_CERT_P12" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are not configured; skipping release."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  app-macos:
    needs: guard
    if: needs.guard.outputs.ready == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Verify version
        env:
          VERSION: ${{ inputs.version }}
        run: grep -qF "<Version>${VERSION}</Version>" Directory.Build.props
      - name: Gate
        run: scripts/check.sh
      - name: Import signing certificate
        env:
          MAC_CERT_P12: ${{ secrets.KZG_MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.KZG_MAC_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/kzg.keychain-db"
          security create-keychain -p "$MAC_CERT_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$MAC_CERT_PASSWORD" "$keychain"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MAC_CERT_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Pack app
        env:
          # The identity inside the .p12. The variable name must match what packaging/pack-app.sh reads
          # (the packaging owner adds the signing hook); check it before the first real release.
          KZG_SIGN_IDENTITY: ${{ secrets.KZG_MAC_SIGN_IDENTITY }}
          KZG_UPDATE_FEED: https://github.com/amadeuspham/kzg-gvg-bot
        run: packaging/pack-app.sh --rid osx-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: app-osx-arm64
          path: packaging/out/velopack-osx-arm64/**

  app-windows:
    needs: guard
    if: needs.guard.outputs.ready == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Gate
        run: scripts/check.sh
      - name: Pack app
        env:
          KZG_UPDATE_FEED: https://github.com/amadeuspham/kzg-gvg-bot
        run: packaging/pack-app.sh --rid win-x64
      - uses: actions/upload-artifact@v7
        with:
          name: app-win-x64
          path: packaging/out/velopack-win-x64/**

  release:
    needs: [app-macos, app-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write   # create the tag and the release, attach assets
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Collect files and write SHA256SUMS
        run: |
          mkdir dist
          # Artifacts keep their folder layout; release assets are flat, so a repeated name is an error.
          # RELEASES-* and assets.*.json are not shipped: the app's GithubSource reads only releases.<channel>.json
          # (Velopack CoreUtil.GetVeloReleaseIndexName) and the .nupkg files that file lists.
          while IFS= read -r f; do
            case "$(basename "$f")" in RELEASES-* | assets.*.json) continue ;; esac
            [ ! -e "dist/$(basename "$f")" ] || { echo "duplicate release file: $(basename "$f")" >&2; exit 1; }
            cp "$f" dist/
          done < <(find artifacts -type f | sort)
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          # A hand-written Download table on top; --generate-notes appends the changelog below it.
          cat > release-notes.md <<'NOTES'
          ## Download

          | Platform | File |
          | --- | --- |
          | Windows | [`DiscordBroadcast-win-x64-Setup.exe`](BASE/DiscordBroadcast-win-x64-Setup.exe) |
          | macOS (Apple Silicon) | [`DiscordBroadcast-macOS-arm64-Setup.pkg`](BASE/DiscordBroadcast-macOS-arm64-Setup.pkg) |
          | Portable (Windows) | [`DiscordBroadcast-win-x64-Portable.zip`](BASE/DiscordBroadcast-win-x64-Portable.zip) |
          | Portable (macOS) | [`DiscordBroadcast-macOS-arm64-Portable.zip`](BASE/DiscordBroadcast-macOS-arm64-Portable.zip) |

          The installers are unsigned, so Windows and macOS warn first; see the install guide in the repository (`docs/guide/getting-started.md`).

          Files ending in `.nupkg` or `.json` are update-feed files that the app downloads by itself. You don't need them. `SHA256SUMS` lists checksums for every file. The bot is not part of releases.

          ## Changes

          NOTES
          # The heredoc is quoted, so the download address is filled in here.
          sed -i "s|BASE|https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}|g" release-notes.md
          gh release create "v${VERSION}" dist/* \
            --target "$GITHUB_SHA" --title "v${VERSION}" \
            --notes-file release-notes.md --generate-notes
