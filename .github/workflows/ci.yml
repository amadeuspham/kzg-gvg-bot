name: CI

on:
  pull_request:
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - '**/*.md'
      - 'package.json'
      - 'package-lock.json'
      - 'infra/**'
      - 'spike/**'
      - '.claude/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/terraform.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - '**/*.md'
      - 'package.json'
      - 'package-lock.json'
      - 'infra/**'
      - 'spike/**'
      - '.claude/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/terraform.yml'
      - '.github/workflows/release.yml'

# Least privilege: CI only reads the repo. No secrets are used anywhere in this file.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-26          # Apple Silicon
            skip_format: "1"
          - name: windows
            os: windows-2025
            skip_format: "1"
          - name: linux
            os: ubuntu-24.04      # libdave needs glibc 2.38 or newer; 22.04 is too old
            skip_format: ""
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # scripts/dotnet.sh picks the SDK from DOTNET_ROOT, which setup-dotnet sets.
      - name: Gate (build, format, tests, coverage)
        env:
          # Live (Discord), real-clock and load tests stay skipped: they need KZG_LIVE=1 / KZG_REALTIME=1 / KZG_LOAD=1.
          KZG_LIVE: ""
          KZG_REALTIME: ""
          KZG_LOAD: ""
          # Format output is the same on every OS, so only Linux runs it.
          KZG_SKIP_FORMAT: ${{ matrix.skip_format }}
        run: scripts/check.sh
